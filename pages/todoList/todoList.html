<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image"
      href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSfbre3nFkdaWX7yhVbDPUzmLyIPHhWi98aTw&s"
    />
    <title>jsTrio - To-Do List</title>

    <!-- custom css -->
    <link rel="stylesheet" href="../../styles/style.css" />

    <!-- font-awesome cdn -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- daisyUI cdn -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Vercel Web Analytics (vanilla HTML) -->
    <script>
      window.va =
        window.va ||
        function () {
          (window.vaq = window.vaq || []).push(arguments);
        };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    <!-- end analytics -->
  </head>

  <body class="flex flex-col min-h-screen">
    <!-- Main Content -->
    <div class="flex-grow container mx-auto px-4 py-12">
      <div class="max-w-4xl mx-auto">
        <!-- Page Title -->
        <div class="text-center mb-8">
          <h1 class="text-4xl md:text-5xl font-bold mb-4">
            <i class="fas fa-list-check text-accent"></i>
            To-Do List Manager
          </h1>
          <p class="text-lg text-base-content/70">
            Organize your tasks efficiently with local storage persistence!
          </p>
        </div>

        <!-- Add Task Button -->
        <div class="flex justify-end mb-6">
          <label for="my_modal_7" class="btn btn-accent btn-lg gap-2">
            <i class="fas fa-plus"></i> Add New Task
          </label>
        </div>

        <!-- Tasks Container -->
        <div id="tasks-container" class="space-y-4">
          <!-- Tasks will be dynamically inserted here -->
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden text-center py-16">
          <i
            class="fas fa-clipboard-list text-6xl text-base-content/20 mb-4"
          ></i>
          <p class="text-xl text-base-content/50">No tasks yet!</p>
          <p class="text-base-content/40 mt-2">
            Click "Add New Task" to get started.
          </p>
        </div>
      </div>
    </div>

    <!-- Add Task Modal -->
    <input type="checkbox" id="my_modal_7" class="modal-toggle" />
    <div class="modal" role="dialog">
      <div class="modal-box">
        <h3 class="font-bold text-2xl mb-4">
          <i class="fas fa-plus-circle text-accent"></i>
          Add New Task
        </h3>
        <form id="task-form" class="space-y-4">
          <div class="form-control">
            <label class="label">
              <span class="label-text font-semibold">Task Heading</span>
            </label>
            <input
              type="text"
              name="task-heading"
              class="input input-bordered w-full"
              placeholder="Enter task title..."
              required
            />
          </div>

          <div class="form-control">
            <label class="label">
              <span class="label-text font-semibold">Task Details</span>
            </label>
            <textarea
              name="task-details"
              class="textarea textarea-bordered h-32 w-full"
              placeholder="Enter task description..."
              required
            ></textarea>
          </div>

          <div class="modal-action">
            <label for="my_modal_7" class="btn btn-ghost">Cancel</label>
            <button type="submit" class="btn btn-accent gap-2">
              <i class="fas fa-check"></i>
              Add Task
            </button>
          </div>
        </form>
      </div>
      <label class="modal-backdrop" for="my_modal_7"></label>
    </div>

    <!-- Load Components -->
    <script src="../../scripts/components.js"></script>
    <script src="./todoList.js"></script>
  </body>
</html>
